<!DOCTYPE html>
<html>
	<head>
		<title>BWIWORLD System Requirements</title>
		<!--The README CSS is small, it's ok to use an internal stylesheet-->
		<style>
			@font-face{
				font-family: "Tahoma";
				src: url("./Tahoma.woff");
			}
			body{
				background-color: #202020;
				align-items: center;
			}
			#content{
				font-family: "Tahoma";
    			width: 75%;
    			margin: 32px auto;
    			padding: 32px;
    			background-color: rgba(255, 255, 225, 0.8);
    			border-radius: 10px;
    			border: 1px solid black;
			}
			@keyframes rainbowtxt {
				from{filter:hue-rotate(0deg)}
				to{filter:hue-rotate(360deg)}
			}
			.rainb {
				color:red;
				animation: rainbowtxt 1s linear infinite;
			}
		</style>
	</head>
	<body>
		<div id=content>
			<img src="./img/logo_readme.png"><br>
			<h2>System Requirements</h2>
			<b>OS:</b> Windows 10 or later is recommended.<br>
			<b>CPU:</b> 4 or 3 Cores<br>
			<b>RAM:</b> 4 GB<br>
			<b>Storage:</b> SSD (recommended), HDD is not recommended.<br>
									
		</div>
	</body>
</html>
